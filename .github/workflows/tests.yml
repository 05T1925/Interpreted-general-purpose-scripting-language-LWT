name: LWT tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check project integrity
        run: python tools/check_project_integrity.py
      - name: Run LWT black-box suite
        run: python tools/run_tests.py
      - name: Bounded concurrency model check
        run: python tools/model_check_concurrency.py --corpus tests/concurrency-model --max-runs 300 --time-budget 90 --require-clean --out reports/s46-concurrency-model
      - name: Run Tk GUI integration tests (Linux)
        if: runner.os == 'Linux'
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            echo "GUI display setup: xvfb-run already installed"
          else
            echo "GUI display setup: xvfb-run missing; installing Xvfb"
            sudo apt-get update
            sudo apt-get install --yes xvfb xauth
          fi
          xvfb-run -a python -c "import tkinter as tk; root = tk.Tk(); print('Tk display ready:', root.tk.call('info', 'patchlevel')); root.destroy()"
          xvfb-run -a python tools/run_gui_integration.py --require-no-skips
      - name: Run Python unit tests (Linux with Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Run Python unit tests (non-Linux)
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q lwt tests tools
